<!DOCTYPE html>
<html>
<head>
    <title>Home Automation</title>
    <style>
        body {
            font-family: Arial;
            background: #1e1e2f;
            color: white;
            text-align: center;
        }
        .card {
            background: #2c2c3e;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            display: inline-block;
            width: 250px;
        }
        button {
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .on { background: green; color: white; }
        .off { background: red; color: white; }
        .view { background: blue; color: white; }
    </style>
</head>
<body>

<h1>🏠 Home Automation Dashboard</h1>

{% for d in devices %}
<div class="card">
    <h2>{{ d.name }}</h2>
    <p>Type: {{ d.type }}</p>
    <p>Status: {{ d.status }}</p>
    <p>Location: {{ d.location }}</p>

    <a href="/toggle/{{ d.id }}">
        <button class="{{ 'on' if d.status == 'OFF' else 'off' }}">
            Turn {{ 'ON' if d.status == 'OFF' else 'OFF' }}
        </button>
    </a>

    <a href="/view/{{ d.id }}">
        <button class="view">View Details</button>
    </a>
</div>
{% endfor %}

</body>
</html>
